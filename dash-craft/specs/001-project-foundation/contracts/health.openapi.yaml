openapi: 3.1.0
info:
  title: DashCraft API - Health
  version: 0.1.0
  description: >
    Health endpoint for the DashCraft API. Unauthenticated by design in this feature
    (authentication is out of scope). Exposes no secrets, exception details, or host names.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Report API and dependency health
      tags: [Health]
      responses:
        '200':
          description: The API and all dependencies are healthy (or degraded but serving).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReport'
              example:
                status: Healthy
                totalDurationMs: 12.4
                checks:
                  - name: database
                    status: Healthy
                    durationMs: 11.9
        '503':
          description: At least one dependency is unhealthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReport'
              example:
                status: Unhealthy
                totalDurationMs: 5003.1
                checks:
                  - name: database
                    status: Unhealthy
                    description: The application database is not reachable.
                    durationMs: 5002.8
components:
  schemas:
    HealthStatus:
      type: string
      enum: [Healthy, Degraded, Unhealthy]
    HealthCheckResult:
      type: object
      required: [name, status, durationMs]
      additionalProperties: false
      properties:
        name:
          type: string
          examples: [database]
        status:
          $ref: '#/components/schemas/HealthStatus'
        description:
          type: string
          description: Short, non-technical message. Never contains exception text or connection details.
        durationMs:
          type: number
          minimum: 0
    HealthReport:
      type: object
      required: [status, totalDurationMs, checks]
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/HealthStatus'
        totalDurationMs:
          type: number
          minimum: 0
        checks:
          type: array
          items:
            $ref: '#/components/schemas/HealthCheckResult'
    ProblemDetails:
      description: >
        RFC 9457 problem details. All non-health error responses from the API (unhandled
        exceptions, validation failures, unknown routes) use this shape. In production, `detail`
        never includes stack traces.
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        traceId: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
