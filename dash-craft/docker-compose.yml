# DashCraft local stack: `docker compose up -d --build`
# Defaults are for local development only. Override them in .env (copy .env.example).
name: dashcraft

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-CU10-ubuntu-24.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-DashCraft_Dev_Passw0rd!}
    ports:
      - "${SQL_PORT:-14330}:1433"
    volumes:
      - dashcraft-sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: src/api/Dockerfile
    environment:
      ConnectionStrings__DashCraft: "Server=sqlserver,1433;Database=DashCraft;User Id=sa;Password=${MSSQL_SA_PASSWORD:-DashCraft_Dev_Passw0rd!};TrustServerCertificate=True;Encrypt=True"
      Database__ApplyMigrationsOnStartup: "true"
      Logging__Console__FormatterName: json
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
    ports:
      - "${API_PORT:-5080}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: src/web
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  dashcraft-sqldata: {}
